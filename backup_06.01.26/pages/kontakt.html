<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HYPEwR | Kontakt</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="scroll-track-container"><div class="scroll-pod-indicator" id="scrollPod"></div></div>
    <div id="nav-placeholder"></div>

    <header class="sub-hero">
        <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2000" class="hero-bg-img" alt="Contact">
        <div class="video-overlay"></div>
        <div class="hero-content">
            <h1>Kontakt</h1>
        </div>
    </header>

    <section class="section">
        <div class="grid-2 reveal">
            
            <div style="display: flex; flex-direction: column;">
                <h2 class="section-title">Napisz do nas</h2>
                <div class="title-bar"></div>
                <form class="card" style="height: auto; flex-grow: 1;">
                    <label style="display: block; margin-bottom: 5px;">Imię i Nazwisko</label>
                    <input type="text" placeholder="Jan Kowalski">
                    
                    <label style="display: block; margin-bottom: 5px;">Adres E-mail</label>
                    <input type="email" placeholder="email@przyklad.pl">
                    
                    <label style="display: block; margin-bottom: 5px;">Wiadomość</label>
                    <textarea rows="6" placeholder="Treść wiadomości..."></textarea>
                    
                    <button type="submit" class="cta-btn" style="width: 100%; margin-top: auto;">Wyślij Wiadomość</button>
                </form>
            </div>

            <div style="display: flex; flex-direction: column;">
                <h2 class="section-title" style="visibility: hidden;">Dane</h2> <div class="title-bar" style="visibility: hidden;"></div>
                
                <div class="card" style="display: flex; flex-direction: column; justify-content: center;">
                    <h3 style="margin-bottom: 30px; font-family: var(--font-head);">Dane Teleadresowe</h3>
                    
                    <div style="margin-bottom: 25px;">
                        <span style="color: var(--text-muted); font-size: 0.9rem;">ADRES E-MAIL</span>
                        <p style="font-size: 1.2rem; color: var(--accent-primary);">kn.hypewr@pwr.edu.pl</p>
                    </div>

                    <div style="margin-bottom: 25px;">
                        <span style="color: var(--text-muted); font-size: 0.9rem;">LOKALIZACJA</span>
                        <p style="font-size: 1.1rem;">
                            Politechnika Wrocławska<br>
                            Budynek C-13, pok. 2.14<br>
                            Wybrzeże Wyspiańskiego 27<br>
                            50-370 Wrocław
                        </p>
                    </div>

                    <div style="margin-top: 20px;">
                        <span style="color: var(--text-muted); font-size: 0.9rem; display: block; margin-bottom: 10px;">SOCIAL MEDIA</span>
                        <div class="social-links">
                            <a href="#">Facebook</a>
                            <a href="#">LinkedIn</a>
                            <a href="#">Instagram</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="../js/script.js"></script>
</body>
</html>
